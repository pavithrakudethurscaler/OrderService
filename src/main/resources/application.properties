spring.application.name=orderservice
server.port=8084

# In-memory H2 by default so the app runs out of the box.
# Use --spring.profiles.active=mysql for MySQL (see application-mysql.properties).
spring.datasource.url=jdbc:h2:mem:orderservice
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

order.currency=INR

# Other services
userservice.base-url=${USERSERVICE_URL:http://localhost:8082}
productservice.base-url=${PRODUCTSERVICE_URL:http://localhost:8080}

# Shared secret for /internal/** endpoints (Payment Service, warehouse tools).
# Internal endpoints are rejected until this is set. Never commit a real value.
internal.api-token=${INTERNAL_API_TOKEN:}

# Notification Service. Leave empty to disable.
notificationservice.base-url=${NOTIFICATIONSERVICE_URL:http://localhost:8086}

# Domain events (HLD 3.6): published to Kafka by default; "rest" posts them to the Notification Service instead
events.transport=${EVENTS_TRANSPORT:kafka}
events.topic=ecom.order-events
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Fail fast if the broker is down, instead of blocking the request for 60 s
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.admin.operation-timeout=5s
